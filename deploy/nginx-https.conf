map $uri $duka_native_cache {
    default "no-cache";
    ~^/api/ "no-store";
    ~^/assets/ "public, max-age=31536000, immutable";
}
map $uri $duka_native_worker_scope {
    default "";
    /notification-worker.js "/";
}
server {
    listen 80;
    server_name reports.example.com;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
    location / { return 308 https://reports.example.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name reports.example.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/reports.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reports.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; media-src 'self' blob:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Cache-Control $duka_native_cache always;
    add_header Service-Worker-Allowed $duka_native_worker_scope;
    root /var/www/duka-agent/app/frontend/dist;
    index index.html;
    client_max_body_size 64m;
    location ~ (^|/)\. { return 404; }
    location = /api { return 404; }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Cache-Control;
    }
    location /assets/ { try_files $uri =404; }
    location /brand/ { try_files $uri =404; }
    location = /notification-worker.js { try_files $uri =404; }
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
    }
    location / { try_files $uri /index.html; }
}
