services:
  frontend:
    image: ${DUKA_FRONTEND_IMAGE:-duka-report-agent-frontend:local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      HOST_PROXY_IP: ${HOST_PROXY_IP:-}
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - application
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  backend:
    image: ${DUKA_BACKEND_IMAGE:-duka-report-agent-backend:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    init: true
    restart: unless-stopped
    # Inherit Docker/host DNS as networks change. A pinned office/VPN resolver
    # can disable provider access away from that network. See deploy/compose-dns.yaml.
    networks:
      - application
    environment:
      DATA_DIR: /data
      APP_ENV: ${APP_ENV:-development}
      REQUIRE_SETUP_TOKEN: ${REQUIRE_SETUP_TOKEN:-false}
      FRONTEND_DIR: /app/no-frontend
      ENV_FILE: /run/duka.env
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      SESSION_HOURS: ${SESSION_HOURS:-24}
      VOICE_ENABLED: ${VOICE_ENABLED:-true}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-}
      MAX_CODEX_RUNTIMES: ${MAX_CODEX_RUNTIMES:-8}
      MAX_CODEX_WORKERS: ${MAX_CODEX_WORKERS:-16}
      REPORT_MAX_ROWS: ${REPORT_MAX_ROWS:-1000000}
      REPORT_MAX_BYTES: ${REPORT_MAX_BYTES:-250000000}
      WORKBOOK_SCRIPT_TIMEOUT_SECONDS: ${WORKBOOK_SCRIPT_TIMEOUT_SECONDS:-300}
      WORKBOOK_SCRIPT_MEMORY_MB: ${WORKBOOK_SCRIPT_MEMORY_MB:-4096}
      TURN_TIMEOUT_SECONDS: ${TURN_TIMEOUT_SECONDS:-0}
      SQLSERVER_HOST: ${SQLSERVER_HOST:-}
      SQLSERVER_PORT: ${SQLSERVER_PORT:-1433}
      SQLSERVER_USER: ${SQLSERVER_USER:-}
      SQLSERVER_PASSWORD: ${SQLSERVER_PASSWORD:-}
      SQLSERVER_DATABASE: ${SQLSERVER_DATABASE:-}
      SQLSERVER_ENCRYPTION: ${SQLSERVER_ENCRYPTION:-require}
      SQLSERVER_TIMEOUT_SECONDS: ${SQLSERVER_TIMEOUT_SECONDS:-15}
    volumes:
      - workspace-data:/data
      - ./backend/queries:/app/queries:ro
      - type: bind
        source: ${DUKA_ENV_FILE:-./.env}
        target: /run/duka.env
        read_only: false
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
volumes:
  # Keep this key and Compose project name: existing installations reuse their
  # original database/uploads/reports volume when moving from the old app service.
  workspace-data:
networks:
  application:
    driver: bridge
